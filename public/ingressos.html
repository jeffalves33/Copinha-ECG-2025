<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Seus ingressos da Copinha ECG">
  <title>Meus Ingressos • Copinha ECG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* pequenos utilitários para estados */
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid var(--color-border);
      border-top-color: #9bb4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: -3px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .fade-in {
      animation: fade .25s ease-out
    }

    @keyframes fade {
      from {
        opacity: .001;
        transform: translateY(2px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .seat {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #fff;
      color: #0b0e13;
      font-weight: 700;
      margin: 4px;
      border: 2px solid #dbe4ff
    }

    .muted {
      color: var(--color-text-secondary)
    }

    .no-print {
      print-color-adjust: exact
    }

    @media print {
      .no-print {
        display: none
      }
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-auto-rows: auto;
      column-gap: 12px;
      row-gap: 6px;
      align-items: center;
    }

    .ticket-grid .title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .ticket-grid .date {
      text-align: right;
    }

    .ticket-grid .action {
      justify-self: end;
      align-self: start;
    }

    /* botão cola à direita, abaixo da data */
    .btn-compact {
      padding: 6px 10px;
      line-height: 1;
      font-size: 0.9em;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">Copinha ECG</a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a class="active" href="ingressos.html">Meus Ingressos</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- MEUS INGRESSOS -->
  <section class="section-lg">
    <div class="container">
      <div style="max-width: 900px; margin: 0 auto;">
        <h1 class="text-center mb-lg">Meus Ingressos</h1>

        <!-- BUSCAR INGRESSOS -->
        <div class="card" style="margin-bottom: var(--spacing-xl);">
          <h3 style="margin-bottom: var(--spacing-md);">Buscar por e-mail</h3>
          <p class="muted" style="margin-bottom: var(--spacing-lg);">
            Digite o <strong>e-mail usado no checkout</strong> para ver seus ingressos pagos.
          </p>

          <form id="formTickets" style="display:flex;gap:var(--spacing-md);flex-wrap:wrap;align-items:flex-end;" novalidate>
            <div style="flex:1;min-width:260px">
              <label for="email" class="muted" style="display:block;margin-bottom:6px">E-mail</label>
              <input id="email" name="email" type="email" required autocomplete="email" class="form-input"
                placeholder="voce@exemplo.com" />
            </div>
            <div>
              <button id="btnBuscar" type="submit" class="btn btn-primary">
                <span class="label">Buscar</span>
              </button>
            </div>
          </form>

          <!-- estado acessível para feedback -->
          <div id="state" class="muted" style="margin-top:12px" aria-live="polite"></div>
        </div>

        <!-- LISTA -->
        <div id="tickets-list"></div>

        <!-- ESTADO VAZIO -->
        <div id="empty-state" class="card" style="text-align:center;padding:var(--spacing-2xl);display:none">
          <div style="font-size:4rem;margin-bottom:var(--spacing-md)">🎫</div>
          <h2 style="margin-bottom:var(--spacing-md)">Nenhum ingresso encontrado</h2>
          <p class="muted" style="margin-bottom:var(--spacing-xl)">
            Não encontramos ingressos pagos para este e-mail.
          </p>
          <a href="index.html" class="btn btn-primary btn-lg">Comprar Ingressos</a>
        </div>

        <!--<div class="text-center" style="margin-top:var(--spacing-lg)">
          <button id="btnPrint" type="button" class="btn btn-secondary no-print">Imprimir / Salvar PDF</button>
        </div>-->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p class="footer-text">© 2025 Copinha ECG. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <!-- QR gerado no cliente (sem build) -->
  <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function () {
      const form = document.getElementById('formTickets');
      const input = document.getElementById('email');
      const state = document.getElementById('state');
      const list = document.getElementById('tickets-list');
      const empty = document.getElementById('empty-state');
      //const btnPrint = document.getElementById('btnPrint');

      // estilos de chip (evitar texto cortado)
      const seatChipStyle = 'display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:#fff;color:#0b0e13;font-weight:700;margin:4px;border:2px solid #dbe4ff;white-space:nowrap;';

      const qsEmail = new URLSearchParams(location.search).get('email');
      const savedEmail = localStorage.getItem('tickets:lastEmail') || '';
      if (qsEmail) input.value = qsEmail; else if (savedEmail) input.value = savedEmail;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!input.checkValidity()) { input.reportValidity(); return; }
        await fetchTickets(input.value.trim().toLowerCase());
      });

      //btnPrint.addEventListener('click', () => window.print());
      if (input.value) fetchTickets(input.value.trim().toLowerCase());

      async function fetchTickets(email) {
        list.innerHTML = '';
        empty.style.display = 'none';
        state.innerHTML = '<span class="spinner"></span> Buscando ingressos...';
        localStorage.setItem('tickets:lastEmail', email);

        const resp = await fetch('/api/tickets?email=' + encodeURIComponent(email)).catch(() => null);
        if (!resp) { state.textContent = 'Erro de rede.'; return; }
        if (!resp.ok) { state.textContent = 'Erro ao buscar (' + resp.status + ').'; return; }

        const data = await resp.json();
        if (!data.ok) { state.textContent = data.message || 'Falha ao obter ingressos.'; return; }
        state.textContent = '';

        const orders = data.tickets || [];
        console.log("🚀 ~ fetchTickets ~ orders: ", orders)
        if (!orders.length) { empty.style.display = 'block'; return; }

        // Render

        orders.forEach((order, idx) => {
          const card = document.createElement('div');
          card.className = 'card fade-in';
          card.style.marginBottom = 'var(--spacing-md)';
          card.style.padding = 'var(--spacing-lg)';
          card.style.display = 'flex';
          card.style.flexDirection = 'column';
          card.style.gap = '10px';
          card.style.animationDelay = (idx * 0.05) + 's';

          const paidAt = order.paidAt ? new Date(order.paidAt).toLocaleString('pt-BR') : '—';
          const seats = order.seats?.map(s => s.code).join(', ') || '—';
          const floors = [...new Set(order.seats.map(s => s.floor))].join(', ') || '—';

          const firstSeat = order.seats?.[0];
          const statusText = firstSeat?.checkedInAt
            ? `Usado em ${new Date(firstSeat.checkedInAt).toLocaleString('pt-BR')}`
            : 'Aguardando check-in';

          card.innerHTML = `
            <div class="ticket-grid">
              <!-- linha 1 -->
              <div class="title">🎫 <span>Pedido ${order.orderId.slice(0, 8)}...</span></div>
              <div class="date muted" style="font-size:0.9em;">${paidAt}</div>

              <!-- linha 2 -->
              <div class="muted">Sessão <strong>${order.session.name}</strong> • Andar <strong>${floors}</strong> • Assento: <strong>${seats}</strong></div>
              <div class="action">
                ${firstSeat?.downloadUrl
              ? `<a href="${firstSeat.downloadUrl}" class="btn btn-primary btn-compact">Baixar PDF</a>`
              : `<span class="muted" style="font-size:0.9em">PDF indisponível</span>`}
              </div>

              <!-- linha 3 -->
              <div class="muted" style="font-size:0.85em">${statusText}</div>
              <div></div>
            </div>
          `;




          list.appendChild(card);
        });

      }
    })();
  </script>
</body>

</html>
