<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Seus ingressos da Espetáculo ECG">
  <title>Naju Events</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* pequenos utilitários para estados */
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid var(--color-border);
      border-top-color: #9bb4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: -3px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .fade-in {
      animation: fade .25s ease-out
    }

    @keyframes fade {
      from {
        opacity: .001;
        transform: translateY(2px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .seat {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #fff;
      color: #0b0e13;
      font-weight: 700;
      margin: 4px;
      border: 2px solid #dbe4ff
    }

    .muted {
      color: var(--color-text-secondary)
    }

    .no-print {
      print-color-adjust: exact
    }

    @media print {
      .no-print {
        display: none
      }
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-auto-rows: auto;
      column-gap: 12px;
      row-gap: 6px;
      align-items: center;
    }

    .ticket-grid .title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .ticket-grid .date {
      text-align: right;
    }

    .ticket-grid .action {
      justify-self: end;
      align-self: start;
    }

    /* botão cola à direita, abaixo da data */
    .btn-compact {
      padding: 6px 10px;
      line-height: 1;
      font-size: 0.9em;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">Espetáculo ECG</a>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a class="active" href="ingressos.html">Meus Ingressos</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- MEUS INGRESSOS -->
  <section class="section-lg">
    <div class="container">
      <div style="max-width: 900px; margin: 0 auto;">
        <h1 class="text-center mb-lg">Meus Ingressos</h1>

        <!-- BUSCAR INGRESSOS -->
        <div class="card" style="margin-bottom: var(--spacing-xl);">
          <h3 style="margin-bottom: var(--spacing-md);">Buscar por CPF</h3>
          <p class="muted" style="margin-bottom: var(--spacing-lg);">
            Digite o <strong>CPF usado no checkout</strong> para ver seus ingressos pagos.
          </p>

          <form id="formTickets" style="display:flex;gap:var(--spacing-md);flex-wrap:wrap;align-items:flex-end;"
            novalidate>
            <div style="flex:1;min-width:260px">
              <label for="cpf" class="muted form-label" style="display:block;margin-bottom:6px">CPF</label>
              <input id="cpf" type="text" class="form-input" placeholder="000.000.000-00" required aria-required="true"
                autocomplete="off">
            </div>
            <div>
              <button id="btnBuscar" type="submit" class="btn btn-primary">
                <span class="label">Buscar</span>
              </button>
            </div>
          </form>

          <!-- estado acessível para feedback -->
          <div id="state" class="muted" style="margin-top:12px" aria-live="polite"></div>
        </div>

        <!-- LISTA -->
        <div id="tickets-list"></div>

        <!-- ESTADO VAZIO -->
        <div id="empty-state" class="card" style="text-align:center;padding:var(--spacing-2xl);display:none">
          <div style="font-size:4rem;margin-bottom:var(--spacing-md)">🎫</div>
          <h2 style="margin-bottom:var(--spacing-md)">Nenhum ingresso encontrado</h2>
          <p class="muted" style="margin-bottom:var(--spacing-xl)">
            Não encontramos ingressos pagos para este e-mail.
          </p>
          <a href="index.html" class="btn btn-primary btn-lg">Comprar Ingressos</a>
        </div>

        <!--<div class="text-center" style="margin-top:var(--spacing-lg)">
          <button id="btnPrint" type="button" class="btn btn-secondary no-print">Imprimir / Salvar PDF</button>
        </div>-->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p class="footer-text">© 2025 Espetáculo ECG. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <!-- QR gerado no cliente (sem build) -->
  <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function () {
      const form = document.getElementById('formTickets');
      const input = document.getElementById('cpf');
      const state = document.getElementById('state');
      const list = document.getElementById('tickets-list');
      const empty = document.getElementById('empty-state');
      //const btnPrint = document.getElementById('btnPrint');

      // estilos de chip (evitar texto cortado)
      const seatChipStyle = 'display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:#fff;color:#0b0e13;font-weight:700;margin:4px;border:2px solid #dbe4ff;white-space:nowrap;';

      const qsCpf = new URLSearchParams(location.search).get('cpf');
      const savedCpf = localStorage.getItem('tickets:lastCpf') || '';
      if (qsCpf) input.value = qsCpf; else if (savedCpf) input.value = savedCpf;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const raw = input.value.trim();
        if (!isValidCPF(raw)) {
          state.textContent = 'CPF inválido. Verifique e tente novamente.';
          return;
        }
        await fetchTickets(raw);
      });

      if (input.value && isValidCPF(input.value)) fetchTickets(input.value.trim());

      async function fetchTickets(cpf) {
        list.innerHTML = '';
        empty.style.display = 'none';
        state.innerHTML = '<span class="spinner"></span> Buscando ingressos...';
        localStorage.setItem('tickets:lastCpf', cpf);
        const resp = await fetch('/api/tickets?cpf=' + encodeURIComponent(cpf)).catch(() => null);
        if (!resp) { state.textContent = 'Erro de rede.'; return; }
        if (!resp.ok) { state.textContent = 'Erro ao buscar (' + resp.status + ').'; return; }

        const data = await resp.json();
        if (!data.ok) { state.textContent = data.message || 'Falha ao obter ingressos.'; return; }
        state.textContent = '';

        const orders = data.tickets || [];

        if (!orders.length) { empty.style.display = 'block'; return; }

        orders.forEach((order, idx) => {
          const orderSession = order.session?.name;
          const tickets = order.seats || [];
          const paidAt = order.paidAt ? new Date(order.paidAt).toLocaleString('pt-BR') : '—';
          const orderId = order.orderId;

          tickets.forEach((ticket, idx) => {
            const card = document.createElement('div');
            card.className = 'card fade-in';
            card.style.marginBottom = 'var(--spacing-md)';
            card.style.padding = 'var(--spacing-lg)';
            card.style.display = 'flex';
            card.style.flexDirection = 'column';
            card.style.gap = '10px';
            card.style.animationDelay = (idx * 0.05) + 's';

            const statusText = ticket?.checkedInAt ? `Usado em ${new Date(ticket.checkedInAt).toLocaleString('pt-BR')}` : 'Aguardando check-in';

            card.innerHTML = `
              <div class="ticket-grid">
                <!-- linha 1 -->
                <div class="title">🎫 <span>Pedido ${orderId.slice(0, 8)}...</span></div>
                <div class="date muted" style="font-size:0.9em;">${paidAt}</div>

                <!-- linha 2 -->
                <div class="muted">Sessão <strong>${orderSession}</strong> • Andar <strong>${ticket.floor}</strong> • Assento: <strong>${ticket.code}</strong></div>
                <div class="action">
                  ${ticket?.downloadUrl
                ? `<a href="${ticket.downloadUrl}" class="btn btn-primary btn-compact">Baixar PDF</a>`
                : `<span class="muted" style="font-size:0.9em">PDF indisponível</span>`}
                </div>

                <!-- linha 3 -->
                <div class="muted" style="font-size:0.85em">${statusText}</div>
                <div></div>
              </div>
            `;

            list.appendChild(card);
          });
        });

      }
    })();

    // Máscara de cpf simples
    document.getElementById('cpf').addEventListener('input', function (e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 11) value = value.slice(0, 11);

      if (value.length > 9) {
        value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6, 9)}-${value.slice(9)}`;
      } else if (value.length > 6) {
        value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6)}`;
      } else if (value.length > 3) {
        value = `${value.slice(0, 3)}.${value.slice(3)}`;
      }
      e.target.value = value;
    });

    function onlyDigits(str) {
      return (str || '').replace(/\D/g, '');
    }

    function isValidCPF(raw) {
      const cpf = onlyDigits(raw);
      if (!cpf || cpf.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(cpf)) return false;
      let sum = 0, rest;
      for (let i = 0; i < 9; i++) sum += Number(cpf[i]) * (10 - i);
      rest = (sum * 10) % 11; if (rest === 10) rest = 0;
      if (rest !== Number(cpf[9])) return false;
      sum = 0;
      for (let i = 0; i < 10; i++) sum += Number(cpf[i]) * (11 - i);
      rest = (sum * 10) % 11; if (rest === 10) rest = 0;
      return rest === Number(cpf[10]);
    }

  </script>
</body>

</html>
