<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naju Events</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/img/icon-180.jpg">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>🔐 Área Administrativa</h1>
        <p>Faça login para acessar o painel</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="password" class="form-label">Senha de Acesso</label>
          <input type="password" id="password" class="form-input" placeholder="Digite a senha" required
            autocomplete="current-password" />
          <div id="passwordError" class="form-error" style="display: none">
            <span>❌</span>
            <span>Senha incorreta. Tente novamente.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full">Entrar no Painel</button>

        <!--<div class="login-demo-info">
            <p><strong>Demo:</strong> Use a senha <code>admin123</code></p>
          </div>-->
      </form>

      <div class="login-footer">
        <a href="../index.html" class="btn btn-secondary btn-full">← Voltar ao Site</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault()

      const password = document.getElementById("password").value
      const errorDiv = document.getElementById("passwordError")

      const res = await fetch("/api/admin/credentials", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const json = await res.json();

      if (json.ok) {
        sessionStorage.setItem("adminAuthenticated", "true");
        sessionStorage.setItem("adminLoginTime", new Date().toISOString());
        window.location.href = "index.html";
      } else {
        errorDiv.style.display = "flex";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
        setTimeout(() => errorDiv.style.display = "none", 3000);
      }
    })
  </script>
</body>

</html>
